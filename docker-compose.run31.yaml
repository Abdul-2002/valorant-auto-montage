# Run 31 via Docker-in-WSL (CPU encode fallback; NVENC needs nvidia-container-toolkit).
#
# From Ubuntu WSL:
#   cd /mnt/c/Users/aasid/OneDrive/Documents/valorant-montage-bot
#   docker compose -f docker-compose.run31.yaml build render
#   docker compose -f docker-compose.run31.yaml run --rm render
#
services:
  render:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONTAGE_CONFIG_PATH=/app/config/default.yaml
      # Prefer software encode when the container has no GPU.
      - FFMPEG_FORCE_LIBX264=1
    volumes:
      - .:/app
      - ./artifacts/run31:/app/artifacts/run31
      - ./models:/app/models
      - /mnt/d/Videos/Valorant:/videos:ro
      - /mnt/c/Users/aasid/Music:/music:ro
    command:
      - python
      - scripts/run_local_pipeline.py
      - --video
      - /videos/Valorant 2026.10.24 - 18.04.52.27.DVR.mp4
      - /videos/Valorant 2026.10.23 - 23.07.34.24.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.55.57.23.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.53.05.22.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.23.24.21.DVR.mp4
      - --music
      - /music/Die For You ft. Grabbitz  Official Music Video  VALORANT Champions 2021.mp3
      - --out
      - /app/artifacts/run31
      - --config
      - /app/config/run31.docker.yaml
