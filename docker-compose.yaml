# Lost SI montage stack:
#   docker compose up -d --build
#
# Services: redis + api + worker + frontend + flower
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - STORAGE_DIR=/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONTAGE_CONFIG_PATH=/app/config/default.yaml
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID:-}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET:-}
      - YOUTUBE_OAUTH_REDIRECT_URI=${YOUTUBE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/youtube/callback}
      - MONTAGE_VIDEO_ROOTS=/videos:/videos_ext
      - MONTAGE_SONG_ROOTS=/songs:/songs_ext
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./songs:/songs:ro
      - ./videos:/videos:ro
      - /mnt/c/Users/aasid/Music:/songs_ext:ro
      - /mnt/d/Videos/Valorant:/videos_ext:ro
      - ./client_secret_326113395181-bjo6vrh2lkvm6hfitcbq4ft1p3vli2im.apps.googleusercontent.com.json:/app/client_secret_326113395181-bjo6vrh2lkvm6hfitcbq4ft1p3vli2im.apps.googleusercontent.com.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # WSL2 GPU: Docker CDI/--gpus is broken here ("no known GPU vendor").
    # Microsoft WSL path: /dev/dxg + /usr/lib/wsl libs enables CUDA + NVENC.
    devices:
      - /dev/dxg
    environment:
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - STORAGE_DIR=/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONTAGE_CONFIG_PATH=/app/config/default.yaml
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID:-}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET:-}
      - YOUTUBE_OAUTH_REDIRECT_URI=${YOUTUBE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/youtube/callback}
      - MONTAGE_VIDEO_ROOTS=/videos:/videos_ext
      - MONTAGE_SONG_ROOTS=/songs:/songs_ext
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      [
        "celery",
        "-A",
        "src.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    volumes:
      - ./data:/data
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./songs:/songs:ro
      - ./videos:/videos:ro
      - /mnt/c/Users/aasid/Music:/songs_ext:ro
      - /mnt/d/Videos/Valorant:/videos_ext:ro
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./client_secret_326113395181-bjo6vrh2lkvm6hfitcbq4ft1p3vli2im.apps.googleusercontent.com.json:/app/client_secret_326113395181-bjo6vrh2lkvm6hfitcbq4ft1p3vli2im.apps.googleusercontent.com.json:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINER_NAME_PREFIX=valorant-montage-bot-
      - API_PROXY_TARGET=http://api:8000
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
    command:
      [
        "celery",
        "-A",
        "src.worker.celery_app:celery_app",
        "flower",
        "--port=5555",
      ]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
