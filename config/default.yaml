output:
  # Realistic for ~17 detected kills at ~3.4s beat slots; raising this without
  # more source footage just starves the composer and trips validation.
  target_duration_sec: 60
  formats: ["16:9", "9:16"]
  resolution: "1920x1080"
  fps: 60
  codec: "h264_nvenc"

effects:
  pipeline_order:
    - velocity
    - freeze_frame
    - zoom
    - shake
    - motion_blur
    - scope_vignette
    - death_pip
    - highlight_bloom
    - light_wrap
    - impact_stylize
    - lens_distort
    - rgb_split
    - letterbox
    - color_grading

  velocity:
    enabled: true
    kill_slowmo_factor: 0.35
    kill_slowmo_duration_sec: 0.6
    transition_speedup_factor: 2.0
    easing: "ease_in_out_cubic"

  zoom:
    enabled: true
    max_zoom: 1.32
    duration_sec: 0.45
    crash_in_frac: 0.35
    easing: "ease_out_quad"
    center: "screen_center"

  shake:
    enabled: true
    amplitude_px: 6
    decay_rate: 0.85
    duration_frames: 8

  color_grading:
    enabled: true
    saturation: 1.3
    contrast: 1.1
    brightness: 0.02
    lut_file: null

  scope_vignette:
    enabled: false
    duration_sec: 0.55
    inner_radius: 0.28
    darkness: 0.88
    flash_scope: true

  death_pip:
    enabled: false
    duration_sec: 0.95
    scale: 2.6
    size_frac: 0.36
    margin_frac: 0.025
    border_px: 5
    desaturate: 0.45

  impact_stylize:
    enabled: false
    duration_sec: 0.45
    edge_strength: 0.55
    glow_strength: 0.35
    brightness_pulse: 0.12

  freeze_frame:
    enabled: false
    duration_sec: 0.08

  motion_blur:
    enabled: false
    duration_sec: 0.25
    amount_px: 28

  letterbox:
    enabled: false
    bar_frac: 0.08
    duration_sec: 1.2

  lens_distort:
    enabled: false
    duration_sec: 0.35
    strength: 0.18

  rgb_split:
    enabled: false
    duration_sec: 0.18
    offset_px: 4

  highlight_bloom:
    enabled: false
    duration_sec: 0.55
    luma_threshold: 0.62
    blur_px: 18
    intensity: 0.85
    weapon_bias: 0.35

  light_wrap:
    enabled: false
    duration_sec: 0.4
    radius: 0.55
    intensity: 0.28

transitions:
  enabled: true
  default_type: "hard_cut"
  beat_drop_type: "flash_white"
  chorus_type: "whip_pan"
  verse_type: "hard_cut"
  flash_duration_sec: 0.05
  xfade_duration_sec: 0.2
  whip_duration_sec: 0.14
  push_duration_sec: 0.12
  whoosh_sfx_path: "assets/sfx/whoosh.wav"
  whoosh_gain_db: -10

audio:
  mixing:
    enabled: true
    music_volume_db: 0
    game_sfx_volume_db: -8

  bass_boost:
    enabled: true
    # v1: keep bass boost active (drops-only is not implemented yet)
    on_drops_only: false
    boost_db: 4
    kill_sfx_overlay: true
    sfx_path: "assets/sfx/bass_hit.mp3"
    sfx_gain_db: -6

detection:
  strategy: "yolo_legacy"
  active_detectors: ["auto_gaming_yolo", "audio_peaks"]

  gemini_video:
    enabled: true
    model: "gemini-2.5-flash"
    min_excitement: 0.3

  hud_ocr:
    enabled: true
    search_window_sec: 2.0
    triggers:
      - text: "HEADSHOT"
        region: [0.42, 0.87, 0.58, 0.95]
      - text: "ACE"
        region: [0.40, 0.15, 0.60, 0.22]
      - text: "CLUTCH"
        region: [0.38, 0.13, 0.62, 0.22]

  valorant_kill_feed:
    region: [0.65, 0.0, 1.0, 0.15]
    confidence_threshold: 0.75
    cooldown_sec: 0.5
    sample_fps: 3

  valorant_yolo:
    enabled: false
    model_path: "models/valorant_killfeed_yolo11n.pt"
    confidence_threshold: 0.5
    region: [0.65, 0.0, 1.0, 0.15]

  auto_gaming_yolo:
    enabled: true
    model_path: "models/auto_gaming_valorant.pt"
    confidence_threshold: 0.5
    region: [0.0, 0.0, 1.0, 1.0]
    sample_fps: 3
    presence_conf: 0.3
    reemit_guard_sec: 1.5
    # Anchor beats on the elimination (killfeed row appears ~0.1s after the body
    # drop). Larger values re-anchor onto the start of the spray, making zooms
    # and slowmo fire visibly before the kill.
    killfeed_latency_sec: 0.1
    refine_full_fps: true

  audio_peaks:
    rms_threshold_percentile: 90
    min_peak_distance_sec: 0.3
    use_hpss: true

  scoring:
    visual_weight: 0.8
    audio_weight: 0.2
    dedup_window_sec: 0.5

ai_director:
  enabled: true
  # provider: "rule_only" # gemini | openai_compatible | local | rule_only
  provider: "gemini"
  style_preset: "aggressive"

  creative_config:
    pacing: 0.8
    effect_intensity: 0.85
    slowmo_bias: 0.6
    flash_frequency: 0.5
    shake_intensity: 0.7
    zoom_aggression: 0.7
    color_warmth: 0.6
    beat_sync_strictness: 0.8
    variety: 0.7
    arc_enabled: true

  gemini:
    api_key: ""
    model: "gemini-2.5-flash-lite"
    temperature: 0.7

  openai_compatible:
    base_url: "http://localhost:11434/v1"
    api_key: ""
    model: "qwen2.5:3b"
    temperature: 0.7

  local:
    model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
    n_gpu_layers: 0
    n_ctx: 4096
    temperature: 0.7
