# Run 3: clip-driven HandClap bed (dense curation) → outputs/run3
#
# From Ubuntu WSL:
#   bash scripts/rerender_run3.sh
#
services:
  render:
    image: valorant-montage-bot-render:torchcodec
    build:
      context: .
      dockerfile: Dockerfile.torchcodec
    working_dir: /app
    mem_limit: 7g
    memswap_limit: 10g
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONTAGE_CONFIG_PATH=/app/config/default.yaml
      - FFMPEG_FORCE_LIBX264=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=threads;1
    volumes:
      - .:/app
      - ./outputs/run3:/app/outputs/run3
      - ./models:/app/models
      - ./videos:/videos:ro
      - ./songs:/songs:ro
    command:
      - python
      - scripts/run_local_pipeline.py
      - --video
      - /videos/Valorant 2026.10.24 - 18.04.52.27.DVR.mp4
      - /videos/Valorant 2026.10.23 - 23.07.34.24.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.55.57.23.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.53.05.22.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.23.24.21.DVR.mp4
      - /videos/Valorant 2026.10.20 - 15.31.23.17.DVR.mp4
      - /videos/Valorant 2026.10.20 - 15.28.49.16.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.55.33.15.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.54.48.14.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.50.15.13.DVR.mp4
      - --music
      - /songs/HandClap - Fitz and the Tantrums.mp3
      - --out
      - /app/outputs/run3
      - --config
      - /app/config/run3.docker.yaml
