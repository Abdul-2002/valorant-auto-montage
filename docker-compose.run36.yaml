# Run 35: 20 VODs + HandClap with all-in-one-infer structure splice (intro→hooks→end).
#
# From Ubuntu WSL:
#   cd /mnt/c/Users/aasid/OneDrive/Documents/valorant-montage-bot
#   docker compose -f docker-compose.run36.yaml build render
#   docker compose -f docker-compose.run36.yaml run --rm render
#
services:
  render:
    image: valorant-montage-bot-render:torchcodec
    build:
      context: .
      dockerfile: Dockerfile.torchcodec
    working_dir: /app
    mem_limit: 7g
    memswap_limit: 10g
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONTAGE_CONFIG_PATH=/app/config/default.yaml
      - FFMPEG_FORCE_LIBX264=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=threads;1
    volumes:
      - .:/app
      - ./artifacts/run36:/app/artifacts/run36
      - ./models:/app/models
      - /mnt/d/Videos/Valorant:/videos:ro
      - /mnt/c/Users/aasid/Music:/music:ro
    command:
      - python
      - scripts/run_local_pipeline.py
      - --video
      - /videos/Valorant 2026.10.24 - 18.04.52.27.DVR.mp4
      - /videos/Valorant 2026.10.23 - 23.07.34.24.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.55.57.23.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.53.05.22.DVR.mp4
      - /videos/Valorant 2026.10.23 - 22.23.24.21.DVR.mp4
      - /videos/Valorant 2026.10.20 - 15.31.23.17.DVR.mp4
      - /videos/Valorant 2026.10.20 - 15.28.49.16.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.55.33.15.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.54.48.14.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.50.15.13.DVR.mp4
      - /videos/Valorant 2026.10.20 - 14.32.26.10.DVR.mp4
      - /videos/Valorant 2026.10.19 - 23.06.09.06.DVR.mp4
      - /videos/Valorant 2026.10.19 - 23.01.56.05.DVR.mp4
      - /videos/Valorant 2026.10.19 - 22.46.19.04.DVR.mp4
      - /videos/Valorant 2026.10.19 - 21.18.07.02.DVR.mp4
      - /videos/Valorant 2026.10.18 - 13.35.26.14.DVR.mp4
      - /videos/Valorant 2026.10.18 - 00.04.41.12.DVR.mp4
      - /videos/Valorant 2026.10.17 - 23.58.04.11.DVR.mp4
      - /videos/Valorant 2026.10.17 - 17.42.39.09.DVR.mp4
      - /videos/Valorant 2026.10.17 - 16.16.31.07.DVR.mp4
      - --music
      - /app/HandClap - Fitz and the Tantrums.mp3
      - --out
      - /app/artifacts/run36
      - --config
      - /app/config/run36.docker.yaml
